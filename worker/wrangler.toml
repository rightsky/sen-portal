name = "sen-ai-proxy"
main = "src/index.js"
compatibility_date = "2026-10-08"
# 대시보드 설정과 맞춤(2026-10-16) : 미리보기 URL 끔, 로그 기록 켬 (배포 시 "override" 확인 창이 뜨지 않게)
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true

[vars]
# 이 주소에서 온 요청만 받는다. 쉼표로 여러 개. 로컬 테스트용 주소는 시연 전에 지워도 된다.
ALLOWED_ORIGINS = "https://rightsky.github.io,http://localhost:8000,http://127.0.0.1:8000"
# 품질 우선 : Opus 5.5 (2026-10-16 Haiku 5.5에서 변경). 비용을 줄이려면 claude-sonnet-5-5 / claude-haiku-5-5
MODEL = "claude-opus-5-5"
# 생각 토큰과 본문이 이 한도를 함께 쓴다. 생각을 켰으면 16000 이상으로 둔다 (2400이면 본문이 비어 올 수 있음)
MAX_OUTPUT_TOKENS = "16000"
# 생각(thinking) : on = 적응형 생각(adaptive), off = 끔
THINKING = "on"
# 생각 깊이 : low · medium · high (Opus 5.5 기본 medium). 깊을수록 느리고 비용이 늘어난다
EFFORT = "medium"
MAX_INPUT_CHARS = "24000"
RATE_PER_MINUTE = "8"

# API 키는 여기 적지 않는다. 터미널에서:  npx wrangler secret put ANTHROPIC_API_KEY
